name: Tissot Kernel Builder

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Ambil Kode dari Repositori Ini
        uses: actions/checkout@v4

      - name: Pasang Library, Dependensi, dan Kompiler Lintas Sistem
        run: |
          sudo apt-get update -y
          sudo apt-get install --fix-missing -y bc build-essential libncurses5-dev libssl-dev xz-utils wget curl git cpio lz4 rsync libgmp3-dev libmpfr-dev libmpc-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Unduh Proton Clang Otomatis Tanpa URL
        # Trik aman: menggunakan action resmi untuk checkout repositori lain tanpa perlu mengetik git clone URL manual
        uses: actions/checkout@v4
        with:
          repository: kdrag0n/proton-clang
          path: toolchain/clang
          depth: 1

      - name: Proses Kompilasi (Compiling) Kernel
        run: |
          export PATH="${{ github.workspace }}/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Membuat konfigurasi bawaan Tissot
          make O=out tissot_defconfig
          
          # Memulai kompilasi silang menggunakan ekosistem penuh bawaan Proton Clang
          make -j$(nproc --all) O=out \
                        CC=clang \
                        CROSS_COMPILE=aarch64-linux-gnu- \
                        CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                        AR=llvm-ar \
                        NM=llvm-nm \
                        OBJCOPY=llvm-objcopy \
                        OBJDUMP=llvm-objdump \
                        STRIP=llvm-strip

      - name: Periksa Hasil Kompilasi
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
             echo "Proses Kompilasi Sukses!"
             mkdir -p ${{ github.workspace }}/output
             cp out/arch/arm64/boot/Image.gz-dtb ${{ github.workspace }}/output/
          else
             echo "Proses Kompilasi Gagal: File Image.gz-dtb tidak terbentuk."
             exit 1
          fi

      - name: Unggah Hasil Kernel (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Tissot-Kernel-Hasil-Compile
          path: ${{ github.workspace }}/output/Image.gz-dtb
          
