name: Tissot Kernel Builder NetHunter

on:
  push:
    branches:
      - main
      - master
      - nethunter
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Ambil Kode dari Repositori Ini
        uses: actions/checkout@v4

      - name: Pasang Library, Dependensi, dan Kompiler Lengkap (64-Bit & 32-Bit)
        run: |
          sudo apt-get update -y
          sudo apt-get install --fix-missing -y bc build-essential libncurses5-dev libssl-dev xz-utils wget curl git cpio lz4 rsync libxml2 flex bison gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Rekayasa Berkas Bluetooth yang Hilang (Anti-Gagal Jaringan)
        run: |
          echo "=== Membuat Berkas Bluetooth Tiruan ==="
          mkdir -p drivers/bluetooth
          touch drivers/bluetooth/btfm_slim.h

      - name: Jinakkan File OpenSSL & Buat Kunci Tiruan (Bypass Certs Error)
        run: |
          echo "=== Menjinakkan Berkas extract-cert.c ==="
          echo 'int main(int argc, char **argv) { return 0; }' > scripts/extract-cert.c
          
          mkdir -p certs
          touch certs/signing_key.x509
          touch certs/x509_certificate_list

      - name: Otomatisasi Suntik Fitur NetHunter & Perbaikan Komponen Akhir
        run: |
          CONFIG_FILE="arch/arm64/configs/tissot_defconfig"
          echo "=== Menyuntikkan Konfigurasi NetHunter ==="
          echo "CONFIG_USB_G_ANDROID=y" >> $CONFIG_FILE
          echo "CONFIG_USB_F_HID=y" >> $CONFIG_FILE
          echo "CONFIG_CONFIGFS_F_HID=y" >> $CONFIG_FILE
          echo "CONFIG_WIRELESS=y" >> $CONFIG_FILE
          echo "CONFIG_CFG80211=y" >> $CONFIG_FILE
          echo "CONFIG_MAC80211=y" >> $CONFIG_FILE
          echo "CONFIG_CFG80211_WEXT=y" >> $CONFIG_FILE
          echo "CONFIG_ATH_CARDS=y" >> $CONFIG_FILE
          echo "CONFIG_ATH9K_HTC=y" >> $CONFIG_FILE
          echo "CONFIG_RTL8187=y" >> $CONFIG_FILE
          echo "CONFIG_RTL_CARDS=y" >> $CONFIG_FILE
          echo "CONFIG_RTL8192CU=y" >> $CONFIG_FILE
          
          echo "=== Mengaktifkan Kembali Driver Bluetooth ==="
          echo "CONFIG_MSM_BT_POWER=y" >> $CONFIG_FILE
          echo "CONFIG_BTFM_SLIM=y" >> $CONFIG_FILE
          
          echo "=== Mematikan Modul Sertifikat & Solusi Linking Error ==="
          echo "CONFIG_MODULE_SIG=n" >> $CONFIG_FILE
          echo "CONFIG_MODULE_SIG_FORCE=n" >> $CONFIG_FILE
          echo "CONFIG_SYSTEM_TRUSTED_KEYRING=n" >> $CONFIG_FILE
          echo "CONFIG_SYSTEM_REVOCATION_LIST=n" >> $CONFIG_FILE
          
          echo "=== Mematikan Modul Kamera & Audio Avtimer ==="
          echo "CONFIG_VIDEO_V4L2_SUBDEV_API=n" >> $CONFIG_FILE
          echo "CONFIG_MEDIA_CAMERA_SUPPORT=n" >> $CONFIG_FILE
          echo "CONFIG_MSM_CAMERA=n" >> $CONFIG_FILE
          echo "CONFIG_MSM_CAMERA_V4L2=n" >> $CONFIG_FILE
          echo "CONFIG_MSM_AVTIMER=n" >> $CONFIG_FILE
          echo "=== Selesai Konfigurasi ==="

      - name: Proses Kompilasi (Compiling) Kernel + Tanda Tangan Custom
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # ==================== TOMBOL TANDA TANGAN KAMU ====================
          export LOCALVERSION="-Umbaran_01"
          export KBUILD_BUILD_USER="sukma"
          export KBUILD_BUILD_HOST="UmbaranDev-Cloud"
          # ==================================================================
          
          # Membuat konfigurasi bawaan Tissot yang sudah dimodifikasi
          make tissot_defconfig
          
          # Membuka jalur include internal secara dinamis (DITAMBAHKAN FOLDER BLUETOOTH)
          export ROOT_DIR="${{ github.workspace }}"
          export INTERNAL_INCLUDES="-I$ROOT_DIR/drivers/gpu/msm -I$ROOT_DIR/drivers/media/platform/msm -I$ROOT_DIR/drivers/media/platform/msm/sde -I$ROOT_DIR/drivers/platform/msm/ipa/ipa_clients -I$ROOT_DIR/drivers/platform/msm/ipa/ipa_v2 -I$ROOT_DIR/drivers/usb/gadget -I$ROOT_DIR/drivers/bluetooth"
          
          # Memulai kompilasi dengan bendera toleransi tingkat tinggi (fpermissive)
          make -j$(nproc --all) KCFLAGS="-w -fpermissive $INTERNAL_INCLUDES" CFLAGS_MODULE="-w" CONFIG_SYSTEM_TRUSTED_KEYS="" CONFIG_MODULE_SIG=n

      - name: Periksa dan Amankan Hasil Kompilasi (Multi-Check)
        run: |
          echo "=== Memulai Proses Pemindahan File Biner ==="
          mkdir -p ${{ github.workspace }}/output
          
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
             cp arch/arm64/boot/Image.gz-dtb ${{ github.workspace }}/output/
             echo "SUKSES: File Image.gz-dtb berhasil diamankan!"
          elif [ -f arch/arm64/boot/Image.gz ]; then
             cp arch/arm64/boot/Image.gz ${{ github.workspace }}/output/
             find arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} ${{ github.workspace }}/output/ \; 2>/dev/null || true
             echo "SUKSES: File Image.gz standar berhasil diamankan!"
          else
             echo "GAGAL: Kompiladora tidak menghasilkan file biner di folder boot."
             exit 1
          fi

      - name: Unggah Hasil Kernel (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Tissot-NetHunter-Kernel
          path: ${{ github.workspace }}/output/
          
