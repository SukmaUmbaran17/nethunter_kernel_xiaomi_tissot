name: Tissot Kernel Builder NetHunter

on:
  push:
    branches:
      - main
      - master
      - nethunter
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Ambil Kode dari Repositori Ini
        uses: actions/checkout@v4

      - name: Pasang Library, Dependensi, dan Kompiler Lengkap (64-Bit & 32-Bit)
        run: |
          sudo apt-get update -y
          sudo apt-get install --fix-missing -y bc build-essential libncurses5-dev libssl-dev xz-utils wget curl git cpio lz4 rsync libxml2 flex bison gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Jinakkan File OpenSSL & Buat Kunci Tiruan (Bypass Certs Error)
        run: |
          echo "=== Menjinakkan Berkas extract-cert.c ==="
          echo 'int main(int argc, char **argv) { return 0; }' > scripts/extract-cert.c
          
          echo "=== Membuat Berkas Kunci Tiruan Kosong ==="
          mkdir -p certs
          touch certs/signing_key.x509
          touch certs/x509_certificate_list

      - name: Rekayasa Paksa File Grafis (Fix KGSL Trace Error)
        run: |
          echo "=== Menyalin File kgsl_trace.h Langsung ke Include Path ==="
          # Menyalin file target ke folder utama agar langsung terbaca oleh include/trace/define_trace.h
          cp drivers/gpu/msm/kgsl_trace.h include/trace/ || true
          cp drivers/gpu/msm/kgsl_trace.h include/trace/../../ || true

      - name: Otomatisasi Suntik Fitur NetHunter & Matikan Modul Pengganggu
        run: |
          CONFIG_FILE="arch/arm64/configs/tissot_defconfig"
          echo "=== Menyuntikkan Konfigurasi NetHunter ==="
          echo "CONFIG_USB_G_ANDROID=y" >> $CONFIG_FILE
          echo "CONFIG_USB_F_HID=y" >> $CONFIG_FILE
          echo "CONFIG_CONFIGFS_F_HID=y" >> $CONFIG_FILE
          echo "CONFIG_WIRELESS=y" >> $CONFIG_FILE
          echo "CONFIG_CFG80211=y" >> $CONFIG_FILE
          echo "CONFIG_MAC80211=y" >> $CONFIG_FILE
          echo "CONFIG_CFG80211_WEXT=y" >> $CONFIG_FILE
          echo "CONFIG_ATH_CARDS=y" >> $CONFIG_FILE
          echo "CONFIG_ATH9K_HTC=y" >> $CONFIG_FILE
          echo "CONFIG_RTL8187=y" >> $CONFIG_FILE
          echo "CONFIG_RTL_CARDS=y" >> $CONFIG_FILE
          echo "CONFIG_RTL8192CU=y" >> $CONFIG_FILE
          
          echo "=== Mematikan Driver Bluetooth Bermasalah ==="
          echo "CONFIG_MSM_BT_POWER=n" >> $CONFIG_FILE
          echo "CONFIG_BTFM_SLIM=n" >> $CONFIG_FILE
          
          echo "=== Mematikan Modul Sertifikat ==="
          echo "CONFIG_SYSTEM_TRUSTED_KEYRING=n" >> $CONFIG_FILE
          echo "CONFIG_SYSTEM_REVOCATION_LIST=n" >> $CONFIG_FILE
          echo "=== Selesai Konfigurasi ==="

      - name: Proses Kompilasi (Compiling) Kernel + Tanda Tangan Custom
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # ==================== TOMBOL TANDA TANGAN KAMU ====================
          export LOCALVERSION="-Sukma-NetHunter"
          export KBUILD_BUILD_USER="sukma"
          export KBUILD_BUILD_HOST="SukmaDev-Cloud"
          # ==================================================================
          
          # Membuat konfigurasi bawaan Tissot yang sudah dimodifikasi
          make tissot_defconfig
          
          # Memulai kompilasi total dengan mengabaikan seluruh warning
          make -j$(nproc --all) KCFLAGS="-w" CFLAGS_MODULE="-w" CONFIG_SYSTEM_TRUSTED_KEYS="" CONFIG_MODULE_SIG=n

      - name: Periksa Hasil Kompilasi
        run: |
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
             echo "Proses Kompilasi Sukses!"
             mkdir -p ${{ github.workspace }}/output
             cp arch/arm64/boot/Image.gz-dtb ${{ github.workspace }}/output/
          else
             echo "Proses Kompilasi Gagal: File Image.gz-dtb tidak terbentuk."
             exit 1
          fi

      - name: Unggah Hasil Kernel (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Tissot-NetHunter-Kernel
          path: ${{ github.workspace }}/output/Image.gz-dtb
          
