name: Tissot Kernel Builder

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Ambil Kode dari Repositori Ini
        uses: actions/checkout@v4

      - name: Pasang Library, Dependensi, dan Semua Kompiler Lengkap
        run: |
          sudo apt-get update -y
          # Menambahkan paket gcc-aarch64 dan gcc-arm secara spesifik untuk memenuhi kebutuhan skrip msm8953
          sudo apt-get install --fix-missing -y bc build-essential libncurses5-dev libssl-dev xz-utils wget curl git cpio lz4 rsync libgmp3-dev libmpfr-dev libmpc-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Proses Kompilasi (Compiling) Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Membuat konfigurasi bawaan Tissot
          make O=out tissot_defconfig
          
          # Memulai kompilasi silang menggunakan Clang didampingi GCC sistem
          make -j$(nproc --all) O=out \
                        CC=clang \
                        CLANG_TRIPLE=aarch64-linux-gnu- \
                        CROSS_COMPILE=aarch64-linux-gnu- \
                        CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                        LD=ld.lld

      - name: Periksa Hasil Kompilasi
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
             echo "Proses Kompilasi Sukses!"
             mkdir -p ${{ github.workspace }}/output
             cp out/arch/arm64/boot/Image.gz-dtb ${{ github.workspace }}/output/
          else
             echo "Proses Kompilasi Gagal: File Image.gz-dtb tidak terbentuk."
             exit 1
          fi

      - name: Unggah Hasil Kernel (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Tissot-Kernel-Hasil-Compile
          path: ${{ github.workspace }}/output/Image.gz-dtb
          
